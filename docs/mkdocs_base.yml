theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/intel-header-logo.svg
  favicon: assets/favicon-32x32.png
  features:
    - navigation.footer
    - content.tooltips
    - navigation.instant
    - content.code.copy
    - content.tabs.link
    - header.autohide
    - content.action.edit
    - content.action.view
    - navigation.indexes
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: intel
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: intel-dark
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
repo_url: https://github.com/intel/confidential-computing.tee.docs/
repo_name: Docu Source
plugins:
  - projects:
      hoisting: true
      projects_dir: ../child_docs
  - git-revision-date-localized:
      enable_creation_date: true
  - search: {}
  - macros:
      module_name: includes/macros
      on_error_fail: false
  - print-site:
      add_cover_page: true
      cover_page_template: "docs/assets/templates/cover_page.tpl"
watch:
  - includes
markdown_extensions:
  toc:
    permalink: true
    toc_depth: 4
  abbr: {}
  attr_list: {}
  pymdownx.snippets:
    base_path: !relative $config_dir
    auto_append:
      - includes/abbreviations.md
    check_paths:
      True
  md_in_html: {}
  admonition: {}
  pymdownx.details: {}
  pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
  pymdownx.tabbed:
    alternate_style: true
  pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
  footnotes: {}
  pymdownx.blocks.caption: {}
  pymdownx.blocks.admonition: {}
  neoteroi.spantable: {}
  pymdownx.caret: {}
  pymdownx.mark: {}
  pymdownx.tilde: {}
  def_list: {}
extra_css:
  - stylesheets/extra.css
  - stylesheets/spantable.css
extra:
  is_child: true
  scope: /
  environment:
    local_deployment: !ENV [LOCAL_DEPLOYMENT, false]
    site_keywords: Confidential Computing, Confidential Computing documentation, Intel, Intel SGX, Intel TDX
  homepage: /
  global_site_name: Intel® Confidential Computing Documentation
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    # The projects plugin builds every child documentation project in isolation, so MkDocs cannot validate links that cross project boundaries.
    # Run build/validate_links.py against the completed parent site after a build to check every cross-project target (and optionally external link) in the generated HTML.
    absolute_links: ignore
    unrecognized_links: warn
